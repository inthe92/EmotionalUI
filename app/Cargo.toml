[package]
name = "emotional-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
[features]
default = ["desktop"]
desktop = ["slint/backend-winit"]
linuxkms = ["slint/backend-linuxkms"]
linuxkms-direct = ["slint/backend-linuxkms-noseat"]
linuxkms-gpu = ["linuxkms-direct", "slint/renderer-femtovg"]
simulator = []
gpu-material = ["slint/renderer-femtovg", "dep:glow"]
linuxkms-gpu-material = ["linuxkms-gpu", "gpu-material"]
[[example]]
name = "gpu_material_lifecycle"
required-features = ["gpu-material"]
[[example]]
name = "focus_preview"
required-features = ["gpu-material"]
[[bin]]
name = "gpu-probe"
path = "src/bin/gpu_probe.rs"
required-features = ["linuxkms-gpu"]
[[bin]]
name = "gpu-pipeline-probe"
path = "src/bin/gpu_pipeline_probe.rs"
required-features = ["linuxkms-gpu"]
[dependencies]
emotional-core = { path = "../core" }
emotional-services = { path = "../services" }
chrono = "=0.4.42"
slint = { version = "=1.13.1", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-systemfonts"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
toml = "=0.8.23"
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg"] }
glow = { version = "=0.16.0", optional = true }
[build-dependencies]
slint-build = "=1.13.1"
