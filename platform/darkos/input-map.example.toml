# code = <observed Linux EV_KEY code>
# action = "confirm"
# [[mapping.axes]]
# code = <observed Linux ABS code>
# min = <measured minimum>
# max = <measured maximum>
# negative = "left"
# positive = "right"
# engage_percent = 35
# release_percent = 20
