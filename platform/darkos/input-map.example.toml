# This profile deliberately has no guessed button codes. Identify/calibrate first.
enabled = false
device_name = "retrogame_joypad"
# device_path is optional: identity discovery handles eventN changing after reboot.
# device_path = "/dev/input/event4"
[mapping]
buttons = []
axes = []
