[workspace]
members = ["app", "core", "services"]
resolver = "2"

[workspace.package]
version = "0.2.0-beta.3"
edition = "2021"
license = "GPL-3.0-only"

[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
# Slint 1.13.1 KMS: render into cached RAM before copying to DRM dumb buffers.
i-slint-backend-linuxkms = { path = "vendor/i-slint-backend-linuxkms" }
